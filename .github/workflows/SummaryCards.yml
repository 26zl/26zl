name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: vn7n24fzkq/github-profile-summary-cards@7022eb6bd48de38b092f54110a8ff8185f2ac4a1 # v0.13.0
        env:
          # Stats and profile-details cards need a PAT with read:user; the default token gets "Resource not accessible by integration".
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: 26zl
          UTC_OFFSET: 2
          EXCLUDE: tex
          AUTO_PUSH: true
